name: iOS IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project PocketVR.xcodeproj -scheme PocketVR -sdk iphonesimulator -configuration Debug -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - run: xcodebuild -project PocketVR.xcodeproj -scheme PocketVR -sdk iphoneos -configuration Release -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: ios
      - run: |
          rm -rf Payload PocketVR-unsigned.ipa
          mkdir Payload
          cp -R device-build/Build/Products/Release-iphoneos/PocketVR.app Payload/PocketVR.app
          chmod -R u+rwX,go+rX Payload/PocketVR.app
          zip -qry PocketVR-unsigned.ipa Payload -x '._*' -x '.DS_Store' -x '__MACOSX'
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: PocketVR-iOS-ipa
          path: ios/PocketVR-unsigned.ipa
