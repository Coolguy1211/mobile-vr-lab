name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Normalize APK output
        run: |
          APK=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/MobileVRLab-release.apk
          ls -l android/app/build/outputs/apk/release/MobileVRLab-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileVRLab-Android-apk
          path: android/app/build/outputs/apk/release/MobileVRLab-release.apk
